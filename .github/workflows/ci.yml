name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go test, vet, and build
    runs-on: self-hosted
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build bot binary
        run: go build -o hara ./cmd/bot

  docker:
    name: Docker build
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build --tag kotonehara:ci .

  deploy-dev-to-vps:
    name: Deploy dev bot to VPS
    needs: [go, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check VPS runtime configuration
        run: |
          test -r /opt/oohara/kotonehara-dev.env
          mkdir -p /opt/oohara/kotonehara-data
          docker network create oohara-dev >/dev/null 2>&1 || docker network inspect oohara-dev >/dev/null
          docker compose version

      - name: Deploy Kotonehara dev
        run: docker compose --project-name kotonehara-dev --file compose.dev.yml up --detach --build --remove-orphans

      - name: Check Kotonehara dev container
        run: |
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format='{{.State.Status}}' kotonehara-dev 2>/dev/null || true)" = running ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose --project-name kotonehara-dev --file compose.dev.yml logs --tail 100
          exit 1

  deploy:
    name: Build and deploy container (Heroku)
    needs: [go, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Log in to Heroku Container Registry
        run: echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build Docker image
        run: docker build --tag registry.heroku.com/$HEROKU_APP_NAME/worker .

      - name: Push Docker image to Heroku
        run: docker push registry.heroku.com/$HEROKU_APP_NAME/worker

      - name: Release Docker image on Heroku
        run: heroku container:release worker --app "$HEROKU_APP_NAME"
